<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Live IDE</title>
    <meta name="description" content="A real-time AI-powered web IDE for interactive project development, live previews, and intelligent pair-programming with Gemini." />
    <meta property="og:title" content="Gemini Live IDE" />
    <meta property="og:description" content="A real-time AI-powered web IDE for interactive project development, live previews, and intelligent pair-programming with Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Gracefully suppress benign Vite HMR WebSocket connection notices in iframe runtime
      window.addEventListener('unhandledrejection', function(event) {
        var str = (event && event.reason) ? (event.reason.stack || event.reason.message || String(event.reason)) : '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var str = (event && event.message) ? event.message : '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
